[project]
name = "market-research"
version = "0.1.0"
description = "Evidence-based research on assets with a credible 10x path over 1-2 years"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "yfinance>=0.2.50",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "certifi>=2026.7.22",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tools/tests"]

[tool.uv]
package = false
